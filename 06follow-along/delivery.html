<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="description" content="Request a delivery from Drone Delivery Services.">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:wght@200;500&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="delivery.css">

    <title>Drone Delivery Services: Request a Delivery</title>
</head>

<body>

    <!-- start the page header -->
    <header>
        <span>Drone Delivery</span>
    </header>

    <!-- start the page navigation -->
    <nav>
        <ul>
            <li>
                <a href="index.html">About Us</a>
            </li>
            <li class="active">
                <a href="delivery.html">Request a Delivery</a>
            </li>
            <li>
                <a href="#">Contact Us</a>
            </li>
        </ul>
    </nav>

    <!-- start the page main -->
    <main>

        <h1>Request a Delivery</h1>

        <form method="get" class="myForm" action="thanks.html">

            <fieldset>
                <legend>Customer Information</legend>

                <label>
                    First Name*
                    <input type="text" name="fName" required>
                </label>

                <label>
                    Last Name*
                    <input type="text" name="lName" required>
                </label>

                <label>
                    Cell Number*
                    <input type="tel" name="phone" placeholder="987-555-1234" required>
                </label>

            </fieldset>

            <fieldset>
                <legend>Delivery Method</legend>

                <label>
                    <input type="radio" name="method" value="drone">
                    Drone Delivery - 2 Hours
                </label>

                <label>
                    <input type="radio" name="method" value="cycle">
                    Motorcycle Delivery - 4 Hours
                </label>

                <label>
                    <input type="radio" name="method" value="robot">
                    Robot Delivery - 6 Hours
                </label>

            </fieldset>

            <fieldset>
                <legend>Delivery Options</legend>

                <label>
                    <input type="checkbox" name="porch" value="chosen">
                    Front Porch
                </label>

                <label>
                    <input type="checkbox" name="deck" value="chosen">
                    Back Deck
                </label>

                <label>
                    <input type="checkbox" name="driveway" value="chosen">
                    Driveway
                </label>

                <label>
                    <input type="checkbox" name="garage" value="chosen">
                    Garage
                </label>

                <label>
                    Preferred Delivery Time

                    <select name="time">
                        <option value="none">Please Select</option>
                        <option value="morning">Morning 7am to 11am</option>
                        <option value="noon">Noon 11am to 2pm</option>
                        <option value="afternoon">Afternoon 2pm to 5pm</option>
                        <option value="evening">Evening 5pm to 8pm</option>
                    </select>
                </label>

            </fieldset>

            <label>
                Comments
                <textarea name="comments"></textarea>
            </label>

            <input type="submit" value="Send Delivery Request">

        </form>

    </main>

    <!-- start the page footer -->
    <footer>
        <p>
            &copy;202X &bull; Drone Delivery Services &bull;
            <a href="mailto:zen@gmail.com">Email Us</a>
        </p>
    </footer>

</body>

</html>
